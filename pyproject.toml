[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "better-speech"
version = "0.2.8"
description = "Vietnamese lessons inside agent voice notes"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{name = "claudes-world"}]
dependencies = ["filelock>=3.16"]

[project.optional-dependencies]
polyglot = []
google = ["google-cloud-texttospeech>=2.21"]
elevenlabs = ["httpx>=0.27"]

[dependency-groups]
dev = [
    "markdown-it-py>=4.2.0",
    "pytest>=8.3",
    "ruff>=0.9",
]

[project.scripts]
speak = "better_speech.cli:main"

[project.urls]
Repository = "https://github.com/claudes-world/better-speech"

[tool.hatch.build.targets.wheel]
packages = ["src/better_speech"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
